# ~/.config/mango/config.conf

xwayland_persistence=0

#####################
# Appearance / colors
#####################
animations=0
layer_animations=0

# borderpx / gappx
borderpx=2
gappih=8
gappiv=8
gappoh=8
gappov=8
smartgaps=0

# sloppyfocus (focus follows mouse)
sloppyfocus=1

#####################
# Tagging / layouts
#####################

tag_num=9
default_mfact=0.55
default_nmaster=1
new_is_master=1


#####################
# Window rules
#####################
windowrule=title:Open File,isfloating:1
windowrule=title:Open Folder,isfloating:1
windowrule=appid:qalculate-gtk,isfloating:1
windowrule=appid:zathura,isfloating:1
windowrule=appid:imv,isfloating:1
windowrule=appid:foot-floating,isfloating:1



monitorrule=name:^eDP-1$,scale:1.2

#####################
# Keyboard
#####################
repeat_rate=25
repeat_delay=600
xkb_rules_layout=es

#####################
# Trackpad
#####################
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
trackpad_scroll_method=1        # 1 = two-finger
trackpad_click_method=0         # 1 = button areas
trackpad_send_events_mode=0     # 0 = enabled
trackpad_accel_profile=2        # 2 = adaptive
trackpad_accel_speed=0.0
button_map=0                    # 0 = left/right/middle

#####################
# Keybindings
#####################
# --- Window focus / movement ---
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusstack,prev
bind=SUPER,Down,focusstack,next

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

bind=SUPER,plus,incnmaster,+1
bind=SUPER,minus,incnmaster,-1
bind=SUPER+CTRL,Right,setmfact,+0.05
bind=SUPER+CTRL,Left,setmfact,-0.05

bind=SUPER+SHIFT,Return,zoom

bind=SUPER,Tab,view,-1
bind=SUPER+SHIFT,r,reload_config

# --- Layouts ---
bind=SUPER,t,setlayout,tile
bind=SUPER,m,setlayout,monocle


bind=SUPER+SHIFT,space,togglefloating
bind=SUPER,F,togglefullscreen

# --- Tags ---
bind=SUPER,0,view,0
bind=SUPER+SHIFT,equal,tag,0

bind=SUPER,1,view,1
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+CTRL+SHIFT,1,toggletag,1

bind=SUPER,2,view,2
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+CTRL+SHIFT,2,toggletag,2

bind=SUPER,3,view,3
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+CTRL+SHIFT,3,toggletag,3

bind=SUPER,4,view,4
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+CTRL+SHIFT,4,toggletag,4

bind=SUPER,5,view,5
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+CTRL+SHIFT,5,toggletag,5

bind=SUPER,6,view,6
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+CTRL+SHIFT,6,toggletag,6

bind=SUPER,7,view,7
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+CTRL+SHIFT,7,toggletag,7

bind=SUPER,8,view,8
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+CTRL+SHIFT,8,toggletag,8

bind=SUPER,9,view,9
bind=SUPER+CTRL,9,toggleview,9
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+CTRL+SHIFT,9,toggletag,9

# --- Monitors ---
bind=SUPER,o,focusmon,left
bind=SUPER+SHIFT,O,tagmon,left

# --- Window/session control ---
bind=SUPER,q,killclient
bind=SUPER+CTRL,q,spawn,systemctl suspend

# --- Applications ---
bind=SUPER,Return,spawn,foot
bind=SUPER,b,spawn,chromium
bind=SUPER,d,spawn_shell,pkill fuzzel || fuzzel
bind=SUPER,r,spawn_shell,pkill fuzzel || ~/scripts/wlr-menu

bind=SUPER,e,spawn,foot -e yazi
bind=SUPER,n,spawn,foot -c ~/.config/foot/foot_no_pad.ini -e nvim
bind=SUPER,p,spawn,foot -e pulsemixer
bind=SUPER,c,spawn,qalculate-gtk
bind=SUPER,h,spawn,foot -c ~/.config/foot/foot_no_pad.ini -e btop

bind=SUPER+SHIFT,A,spawn,foot -a foot-floating -e bluetuith
bind=SUPER,w,spawn_shell,pkill fuzzel || iwmenu -l fuzzel
bind=SUPER,a,spawn_shell,pkill fuzzel || bzmenu -l fuzzel
bind=SUPER,v,spawn_shell,pkill fuzzel || cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind=SUPER,l,spawn,~/scripts/dmenu_logout.sh
bind=SUPER,u,spawn,~/scripts/prompt.sh
bind=SUPER+SHIFT,W,spawn,~/scripts/background.sh
bind=SUPER+SHIFT,S,spawn,~/scripts/screenshot_river.sh
bind=SUPER,s,spawn_shell,pkill wlsunset || wlsunset -l 40.4165 -L -3.70256
bind=SUPER+SHIFT,b,spawn_shell,pkill waybar; waybar

# --- Media keys ---
bind=NONE,XF86AudioMute,spawn,~/scripts/volume.sh mute
bind=NONE,XF86AudioMicMute,spawn,~/scripts/mic.sh
bind=NONE,XF86AudioLowerVolume,spawn,~/scripts/volume.sh down
bind=NONE,XF86AudioRaiseVolume,spawn,~/scripts/volume.sh up
bind=NONE,XF86MonBrightnessUp,spawn,~/scripts/brightness.sh up
bind=NONE,XF86MonBrightnessDown,spawn,~/scripts/brightness.sh down
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86Calculator,spawn,qalculate-gtk

# --- VT switching (CHVT macro) ---
bind=CTRL+ALT,F1,chvt,1
bind=CTRL+ALT,F2,chvt,2
bind=CTRL+ALT,F3,chvt,3
bind=CTRL+ALT,F4,chvt,4
bind=CTRL+ALT,F5,chvt,5
bind=CTRL+ALT,F6,chvt,6
bind=CTRL+ALT,F7,chvt,7
bind=CTRL+ALT,F8,chvt,8
bind=CTRL+ALT,F9,chvt,9
bind=CTRL+ALT,F10,chvt,10
bind=CTRL+ALT,F11,chvt,11
bind=CTRL+ALT,F12,chvt,12

#####################
# Mouse bindings
#####################
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglefloating
mousebind=SUPER+CTRL,btn_left,moveresize,curresize

#####################
# Switch bindings (laptop lid)
#####################
switchbind=fold,spawn,wlr-randr --output eDP-1 --off
switchbind=unfold,spawn,wlr-randr --output eDP-1 --on

#####################
# Autostart
#####################
exec-once=~/.config/mango/autostart.sh


source=~/.config/mango/colors.conf
